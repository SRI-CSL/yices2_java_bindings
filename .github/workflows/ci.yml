name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  YICES_REF: 016a6243de768046f4fba6f88a8659ce1a18d261

jobs:
  unix:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Yices
        uses: actions/checkout@v4
        with:
          repository: SRI-CSL/yices2
          ref: ${{ env.YICES_REF }}
          path: yices2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ant autoconf automake g++ gcc gperf libgmp-dev libtool m4 make pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install ant autoconf automake gmp gperf libtool make pkg-config

      - name: Build and test
        env:
          YICES_SRC: ${{ github.workspace }}/yices2
          YICES_PREFIX: ${{ runner.temp }}/yices-install
        run: bash scripts/ci-build-test-unix.sh

  windows:
    name: windows-latest
    runs-on: windows-latest

    steps:
      - run: git config --global core.autocrlf false && git config --global core.eol lf

      - uses: actions/checkout@v4

      - name: Checkout Yices
        uses: actions/checkout@v4
        with:
          repository: SRI-CSL/yices2
          ref: ${{ env.YICES_REF }}
          path: yices2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Ant
        shell: powershell
        run: choco install ant -y

      - name: Install Cygwin dependencies
        uses: cygwin/cygwin-install-action@v4
        with:
          packages: |
            autoconf,
            automake,
            cmake,
            coreutils,
            curl,
            gperf,
            libtool,
            m4,
            make,
            mingw64-x86_64-gcc-core,
            mingw64-x86_64-gcc-g++,
            moreutils,
            wget

      - name: Build and test
        shell: bash
        env:
          CYGWIN: winsymlinks:native binmode
          YICES_SRC: ${{ github.workspace }}/yices2
          YICES_PREFIX: /tmp/yices-install
        run: bash scripts/ci-build-test-windows.sh
